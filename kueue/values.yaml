# Helm values for oci://registry.k8s.io/kueue/charts/kueue (scripts/kueue.sh).
# Only workloads that carry kueue.x-k8s.io/queue-name are managed: nothing changes for other
# namespaces unless they opt in.
managerConfig:
  controllerManagerConfigYaml: |-
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
    controller:
      groupKindConcurrency:
        Job.batch: 5
        Pod: 5
        Workload.kueue.x-k8s.io: 5
        LocalQueue.kueue.x-k8s.io: 1
        ClusterQueue.kueue.x-k8s.io: 1
        ResourceFlavor.kueue.x-k8s.io: 1
    manageJobsWithoutQueueName: false
    waitForPodsReady:
      enable: false
    integrations:
      frameworks:
        - "batch/job"
        - "pod"
        - "deployment"
        - "leaderworkerset.x-k8s.io/leaderworkerset"
      podOptions:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values: [kube-system, kueue-system]
