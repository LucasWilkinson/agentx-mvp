# GKE A4 B200 spot cluster (8 GPUs/node, eight RoCE RDMA interfaces).
# Live inventory verified 2026-08-30. Model code and caches are node-local on
# persistent SSD; every pod on a given node sees it at /workspace.
name: gke-b200
gpus_per_node: 8
naming:
  # The default namespace is shared by multiple users/workloads.
  user_prefix: true
accelerators:
  default: b200
  profiles:
    b200:
      resource_name: nvidia.com/gpu
      presence_label: cloud.google.com/gke-gpu
      node_selector: {cloud.google.com/gke-accelerator: nvidia-b200}
      gpu_arch: b200
      torch_cuda_arch_list: "10.0+PTX"
cache:
  hf_home: /var/cache/huggingface
rdma:
  # filter-render.py expands the GKE multi-network annotation into requests
  # for rdma-0 through rdma-7. Keep rdma-0 here so unfiltered renders fail
  # closed instead of launching with no RDMA attachment at all.
  resource_name: networking.gke.io.networks/rdma-0
  value: "1"
pod_defaults:
  shm_size: 128Gi
  image_pull_policy: Always
  annotations:
    networking.gke.io/default-interface: eth0
    networking.gke.io/interfaces: |-
      [
        {"interfaceName":"eth0","network":"default"},
        {"interfaceName":"eth2","network":"rdma-0"},
        {"interfaceName":"eth3","network":"rdma-1"},
        {"interfaceName":"eth4","network":"rdma-2"},
        {"interfaceName":"eth5","network":"rdma-3"},
        {"interfaceName":"eth6","network":"rdma-4"},
        {"interfaceName":"eth7","network":"rdma-5"},
        {"interfaceName":"eth8","network":"rdma-6"},
        {"interfaceName":"eth9","network":"rdma-7"}
      ]
  container_security_context:
    runAsUser: 0
    runAsGroup: 0
    privileged: true
    capabilities: {add: [IPC_LOCK, SYS_RAWIO]}
  extra_volumes:
    # B200 has no RWX filesystem. Keep `ve` worktrees and compiled environments
    # on each node's persistent local SSD at one identical absolute path.
    - name: vllm-workspace
      hostPath:
        path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/vllm-workspace/
        type: DirectoryOrCreate
    - name: hf-cache
      hostPath:
        path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/vllm-hf-cache/
        type: DirectoryOrCreate
    - {name: jit-cache, emptyDir: {}}
  extra_volume_mounts:
    - {name: vllm-workspace, mountPath: /workspace}
    - {name: hf-cache, mountPath: /var/cache/huggingface}
    - {name: jit-cache, mountPath: /var/cache/vllm}
fabric:
  ucx_net_devices: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1
  default_profile: standard
  expert_parallel_profiles:
    prefill: deepep_prefill
    decode: deepep_decode
  default_env:
    UCX_IB_ROCE_REACHABILITY_MODE: all
    UCX_NET_DEVICES: "{ucx_net_devices}"
    NCCL_SOCKET_IFNAME: eth0
    GLOO_SOCKET_IFNAME: eth0
    NCCL_TUNER_PLUGIN: none
    NCCL_NET_PLUGIN: ""
  profiles:
    standard: {}
    deepep_prefill: {}
    deepep_decode: {}
llm_d:
  release: v0.9.0
  images:
    routing_sidecar: ghcr.io/llm-d/llm-d-router-disagg-sidecar:{release}
