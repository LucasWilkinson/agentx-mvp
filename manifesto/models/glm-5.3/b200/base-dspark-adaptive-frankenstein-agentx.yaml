# GLM-5.3 + DSpark compatibility-smoke settings on B200.
# The prefiller materializes draft KV; adaptive verification is enabled only
# on the decoder. The 142K limit covers the capped OpenHands workload without
# DCP or HiSparse and keeps CUDA graphs enabled on the decoder.
extends: base-agentx-prefill8-dp8.yaml
runtime:
  vllm_env: /workspace/vdptest/pcp-dspark-offload-fix-56c8609f68
  env:
    EXPECTED_VLLM_COMMIT: 56c8609f683b5c94c8c996d24e69657977fe6ad5
vars:
  dspark: &dspark
    method: dspark
    model: RedHatAI/GLM-5.2-speculator.dspark
    revision: cc714308fc4ad68b667a6a71bbf2a344c2ef903b
    num_speculative_tokens: 7
    draft_sample_method: probabilistic
    kv_cache_dtype: fp8
roles:
  prefill:
    vllm:
      max_model_len: 142000
      # DSpark's full-attention draft uses FlashInfer, which does not accept
      # the packed verifier-only fp8_ds_mla cache dtype.
      kv_cache_dtype: fp8
      speculative_config: *dspark
  decode:
    vllm:
      max_model_len: 142000
      kv_cache_dtype: fp8
      speculative_config:
        <<: *dspark
        enable_adaptive_verification: true
