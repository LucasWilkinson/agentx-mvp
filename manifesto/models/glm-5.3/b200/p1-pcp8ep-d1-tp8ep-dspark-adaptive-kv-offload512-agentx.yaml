# PCP8+EP8+TP1 DSpark7 prefiller into TP8+EP8 DSpark7 adaptive decoder,
# with a node-wide 512 GiB native KV host tier on both roles.
extends: base-dspark-adaptive-kv-offload512-frankenstein-agentx.yaml
release: glm53-b200-pcp8-ep8-dspark-d1-tp8-ep8-adaptive-offload512
model:
  label: glm53-b200-pcp8-ep8-dspark-d1-tp8-ep8-adaptive-offload512
  served_name: glm53-b200-pcp8-ep8-dspark-d1-tp8-ep8-adaptive-offload512
roles:
  prefill:
    parallelism: {gpus: 8, tp: 1, pcp: 8, dcp: 1, dp: 1, ep: true}
    env:
      VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
  decode:
    parallelism: {gpus: 8, tp: 8, pcp: 1, dcp: 1, dp: 1, ep: true}
    dp_load_balancing: $delete
