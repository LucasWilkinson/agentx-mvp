# PCP8 + EP8 prefill control with the shared DP8 + EP8 MTP-3 decoder.
extends: base-agentx-prefill8-dp8.yaml
release: glm53-b200-pcp8-ep8
model:
  label: glm53-b200-pcp8-ep8
  served_name: glm53-b200-pcp8-ep8
roles:
  prefill:
    parallelism: {gpus: 8, tp: 1, pcp: 8, dcp: 1, dp: 1, ep: true}
    vllm:
      # Reserve workspace for sparse FlashMLA under concurrent long-prefill load.
      gpu_memory_utilization: 0.87
    kv_transfer_config:
      engine_id: glm53-b200-pcp8-ep8-prefill
    env:
      # The direct intra-PCP KV path cannot be combined with the external NIXL
      # connector used by this P/D deployment.
      VLLM_USE_PCP_DIRECT_KV: "0"
      VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
