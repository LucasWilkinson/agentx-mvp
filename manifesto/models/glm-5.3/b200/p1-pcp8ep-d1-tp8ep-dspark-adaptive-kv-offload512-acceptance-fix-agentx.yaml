# Clean validation of LucasWilkinson/vllm:t3code/reproduce-b300-acceptance-collapse.
extends: p1-pcp8ep-d1-tp8ep-dspark-adaptive-kv-offload512-agentx.yaml
release: glm53-b200-pcp8-tp8-dspark-acceptance-fix
model:
  label: glm53-b200-pcp8-tp8-dspark-acceptance-fix
  served_name: glm53-b200-pcp8-tp8-dspark-acceptance-fix
runtime:
  vllm_env: /workspace/vdptest/acceptance-fix-1e5c710a7
  env:
    EXPECTED_VLLM_COMMIT: 1e5c710a79d6137cf4e1852060d97a44cdd501e9
roles:
  prefill:
    # The tensor-comparison run uses only NIXL so repeated debug restarts do
    # not spend minutes materializing an unrelated 512 GiB host tier.
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_producer
      kv_load_failure_policy: fail
      kv_connector_extra_config:
        enforce_handshake_compat: false
        num_threads: 1
  decode:
    # Fixed seven-token verification isolates P/D draft-KV correctness from
    # the adaptive cost-table warmup regression at this pinned commit.
    vllm:
      speculative_config:
        method: dspark
        model: RedHatAI/GLM-5.2-speculator.dspark
        revision: cc714308fc4ad68b667a6a71bbf2a344c2ef903b
        num_speculative_tokens: 7
        draft_sample_method: probabilistic
        kv_cache_dtype: fp8
        enable_adaptive_verification: false
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_consumer
      kv_load_failure_policy: fail
      kv_connector_extra_config:
        enforce_handshake_compat: false
        num_threads: 1
