# PCP8+EP8+TP1 DSpark prefiller into a graph-enabled DP8+EP8 DSpark
# adaptive-verification decoder on B200.
extends: base-dspark-adaptive-frankenstein-agentx.yaml
release: glm53-b200-pcp8-ep8-dspark-d1-dp8-ep8-adaptive
model:
  label: glm53-b200-pcp8-ep8-dspark-d1-dp8-ep8-adaptive
  served_name: glm53-b200-pcp8-ep8-dspark-d1-dp8-ep8-adaptive
roles:
  prefill:
    parallelism: {gpus: 8, tp: 1, pcp: 8, dcp: 1, dp: 1, ep: true}
    kv_transfer_config:
      engine_id: glm53-b200-pcp8-ep8-dspark-prefill-dp8-decoder
    env:
      VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
  decode:
    parallelism: {gpus: 8, tp: 1, pcp: 1, dcp: 1, dp: 8, ep: true}
