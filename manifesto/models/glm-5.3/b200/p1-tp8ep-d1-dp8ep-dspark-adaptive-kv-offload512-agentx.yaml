# TP8+EP8 DSpark7 prefiller into the shared DP8+EP8 DSpark7 adaptive decoder,
# with a node-wide 512 GiB native KV host tier on both roles. The TP prefiller
# uses one 512 GiB region; each of the eight decoder engines receives 64 GiB.
extends: base-dspark-adaptive-kv-offload512-frankenstein-agentx.yaml
release: glm53-b200-tp8-ep8-dspark-d1-dp8-ep8-adaptive-offload512
model:
  label: glm53-b200-tp8-ep8-dspark-d1-dp8-ep8-adaptive-offload512
  served_name: glm53-b200-tp8-ep8-dspark-d1-dp8-ep8-adaptive-offload512
roles:
  prefill:
    parallelism: {gpus: 8, tp: 8, pcp: 1, dcp: 1, dp: 1, ep: true}
  decode:
    parallelism: {gpus: 8, tp: 1, pcp: 1, dcp: 1, dp: 8, ep: true}
    kv_transfer_config:
      kv_connector: MultiConnector
      kv_role: kv_both
      kv_load_failure_policy: fail
      kv_connector_extra_config:
        connectors:
          - kv_connector: NixlConnector
            kv_role: kv_consumer
            kv_load_failure_policy: fail
            kv_connector_extra_config:
              enforce_handshake_compat: false
              num_threads: 1
          - kv_connector: OffloadingConnector
            kv_role: kv_both
            kv_connector_extra_config:
              spec_name: TieringOffloadingSpec
              cpu_bytes_to_use: 68719476736 # 64 GiB/rank x 8 DP ranks
              eviction_policy: lru
