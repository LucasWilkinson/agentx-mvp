# GLM-5.3 + DSpark7 on the no-direct-KV lineage plus an optional symmetric
# staging path for the PCP-spanning-DCP token-sharded prefill, on CoreWeave
# H200. Branch LucasWilkinson/vllm:frankenstein-nodk-ts-staging @ 4883c2d083.
#
# Why this exists. On the collectives/no-direct-KV branches the DCP==PCP sparse
# prefill runs `forward_mqa_token_sharded`, which per 256-row chunk per layer
# issues three group-wide NCCL collectives: a query all-gather, an LSE
# all-gather and an output reduce-scatter. Measured 2026-09-09 against the
# peer-gather route (which reads context KV straight from the DCP owners'
# symmetric-memory caches and needs no group sync in the inner loop):
#
#   conc  TTFT ms coll/peer   out tok/s      accept
#     1     1708 / 916        76.6 / 108.1   83.4 / 84.0
#     2     1701 / 978       143.5 / 188.5   84.0 / 82.7
#     4      968 / 862       372.1 / 369.8   84.1 / 83.1
#     8     5591 / 2041      242.5 / 425.1   83.9 / 82.5
#
# Acceptance matches everywhere, so the collective path is correct; it is the
# transport that is slow. Engine-side peak prefill throughput is pinned at
# 9.0K tok/s on the collective path versus 23.7K on peer-gather, and at c8 the
# offered load exceeds that ceiling.
#
# This arm sets VLLM_USE_DIRECT_PCP_TOKEN_SHARDED=1, which routes the query
# row-gather and the output reduce-scatter through symmetric-memory workspaces
# instead of NCCL while keeping the token-sharded structure. It tests whether
# the ceiling is transport or inherent.
#
# Note this stages a workspace; it does not allocate the KV cache in symmetric
# memory the way PR #52863 did, so it should not conflict with the extendable
# KV cache work in PR #50779.
extends: base-agentx-prefill8-dp8.yaml
runtime:
  # Shared RWX workspace PVC: one `ve` env serves every node and both roles.
  vllm_env: /workspace/vdptest/frankenstein-ts-staging-4883c2d0
  env:
    EXPECTED_VLLM_COMMIT: 4883c2d083e7571851487f6556f78611cbe00f52
vars:
  dspark: &dspark
    method: dspark
    model: RedHatAI/GLM-5.2-speculator.dspark
    revision: cc714308fc4ad68b667a6a71bbf2a344c2ef903b
    num_speculative_tokens: 7
    draft_sample_method: probabilistic
    kv_cache_dtype: fp8
roles:
  prefill:
    env:
      VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
      # A worker that dies on a signal otherwise leaves no trace at all.
      PYTHONFAULTHANDLER: "1"
    vllm:
      max_model_len: 142000
      gpu_memory_utilization: 0.94
      max_num_batched_tokens: 16384
      # DSpark's full-attention draft uses FlashInfer, which does not accept
      # the packed verifier-only fp8_ds_mla cache dtype.
      kv_cache_dtype: fp8
      speculative_config: *dspark
      # Prefix caching stays on: the copy-on-write path is exercised on both
      # the replicated DCP1 and the PCP-spanning DCP=PCP layouts.
      enable_prefix_caching: true
      attention_config:
        sparse_mla_force_mqa: true
      compilation_config:
        cudagraph_mode: PIECEWISE
  decode:
    env:
      PYTHONFAULTHANDLER: "1"
    # 48 vCPU + the 8 vCPU routing-proxy sidecar. The inherited 64 + 8 = 72
    # cannot schedule next to the long-lived devbox/router pods (~60 vCPU
    # requested) on whichever node they share, and nothing here needs it.
    resources: {cpu: 48, memory: 600Gi, gpus: 8, ephemeral_storage: 100Gi}
    vllm:
      max_model_len: 142000
      kv_cache_dtype: fp8
      speculative_config:
        <<: *dspark
        enable_adaptive_verification: false
