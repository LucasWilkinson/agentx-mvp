# GLM-5.3 + DSpark7 on the no-direct-KV lineage with PR #54036 backed out, on
# CoreWeave H200. Branch LucasWilkinson/vllm:frankenstein-nodk-no-54036 @
# 20a94597ec. Exists only to price #54036 ("[Perf][PCP][DSpark] Shard
# context-KV precompute across PCP ranks") against the otherwise identical
# nodk arm at 1ca5131a07.
#
# Caveat on what this can measure. #54036's headline effect - sharding the KV
# projection in `precompute_and_store_context_kv` - was already undone on this
# lineage by the commit that made the context restore unconditional (needed so
# DSpark runs without direct KV at DCP=1). At 1ca5131a07 every PCP rank already
# projects the full global context and writes only the rows it owns via
# PAD_SLOT_ID. What remains to remove is the ordering of `combine_hidden_states`
# relative to the all-gather, which changes the gathered width from
# `hidden_size` to `sum(aux_dims)` (~3x hidden for GLM-shaped drafters).
#
# So this arm reports a LOWER BOUND on #54036's upstream value. A true
# measurement wants the direct-KV lineage, where its sharding is intact.
extends: base-agentx-prefill8-dp8.yaml
runtime:
  # Shared RWX workspace PVC: one `ve` env serves every node and both roles.
  vllm_env: /workspace/vdptest/frankenstein-no54036-20a94597
  env:
    EXPECTED_VLLM_COMMIT: 20a94597eca68396fb9dae2f860138751a59c4c3
vars:
  dspark: &dspark
    method: dspark
    model: RedHatAI/GLM-5.2-speculator.dspark
    revision: cc714308fc4ad68b667a6a71bbf2a344c2ef903b
    num_speculative_tokens: 7
    draft_sample_method: probabilistic
    kv_cache_dtype: fp8
roles:
  prefill:
    env:
      VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
      # A worker that dies on a signal otherwise leaves no trace at all.
      PYTHONFAULTHANDLER: "1"
    vllm:
      max_model_len: 142000
      gpu_memory_utilization: 0.94
      max_num_batched_tokens: 16384
      # DSpark's full-attention draft uses FlashInfer, which does not accept
      # the packed verifier-only fp8_ds_mla cache dtype.
      kv_cache_dtype: fp8
      speculative_config: *dspark
      # Prefix caching stays on: the copy-on-write path is exercised on both
      # the replicated DCP1 and the PCP-spanning DCP=PCP layouts.
      enable_prefix_caching: true
      attention_config:
        sparse_mla_force_mqa: true
      compilation_config:
        cudagraph_mode: PIECEWISE
  decode:
    env:
      PYTHONFAULTHANDLER: "1"
    # 48 vCPU + the 8 vCPU routing-proxy sidecar. The inherited 64 + 8 = 72
    # cannot schedule next to the long-lived devbox/router pods (~60 vCPU
    # requested) on whichever node they share, and nothing here needs it.
    resources: {cpu: 48, memory: 600Gi, gpus: 8, ephemeral_storage: 100Gi}
    vllm:
      max_model_len: 142000
      kv_cache_dtype: fp8
      speculative_config:
        <<: *dspark
        enable_adaptive_verification: false
