# GLM-5.3 + DSpark7 on the clean prefiller lineage,
# LopezCastroRoberto/vllm:frankenstein-prefiller-clean, on CoreWeave H200.
#
# H200 port of the B200 `base-dspark-adaptive-frankenstein-clean-agentx`
# spec with two hardware-forced deviations:
#
#   * Adaptive verification is OFF (fixed DSpark7, probabilistic draft
#     sampling). It captures varlen decode CUDA graphs and therefore requires
#     a target attention builder reporting AttentionCGSupport.ALWAYS. On SM90
#     the sparse-MLA backend is FlashMLASparse (UNIFORM_BATCH); the only
#     ALWAYS-capable sparse MLA builder is FlashInfer's TRT-LLM kernel, gated
#     to compute capability 10 (flashinfer_mla_sparse.py:98). The check in
#     adaptive_verification.py:481 is unconditional. Both decoders died with
#     that ValueError on the first H200 attempt.
#   * TP1+EP8 roles load 115.55 GiB of weights per H200 (dense weights are
#     replicated across the EP ranks). At 0.90 utilization that left 6.35 GiB
#     of KV, but one 142K request needs 10.38 GiB with fp8 verifier + draft
#     KV. The prefiller runs at 0.94 with a 16K token budget and the DP8
#     decoder at 0.95; the TP8 decoder (88 GiB of weights) keeps 0.92.
#
# The 142K limit covers the capped OpenHands workload without HiSparse and
# keeps CUDA graphs enabled on the decoder.
#
# Every arm built on this base runs a PCP prefiller, and `PCPManager.
# validate_config` constrains the role three ways:
#
#   1. DSpark under PCP requires VLLM_USE_PCP_DIRECT_KV=1, otherwise the
#      context-KV precompute is skipped and each rank drafts from an
#      incomplete context.
#   2. PCP admits PIECEWISE CUDA graphs only.
#   3. On da30e1b9f5 a direct-KV prefiller admitted a plain NixlConnector
#      kv_producer only, rejecting other connectors and offloading. The pin
#      below removes that guard; see the offload note further down.
#
# Pinned to e7ede2722, which is `frankenstein-prefiller-clean` (da30e1b9f5)
# plus six commits. `git merge-base da30e1b9f5 e7ede2722` is da30e1b9f5, so
# this is the pushed branch and nothing else. Three of the six are required
# for this matrix to produce valid results:
#
#   8a1e0d1e7a/9806bdb527  DSpark draft KV layout. Without them every DSpark
#     decoder dies in compile_or_warm_up_model with "KV cache layout has not
#     been resolved yet". vllm-project/vllm#55384 is the upstream-track fix
#     for the same bug; these commits are the equivalent on this lineage.
#   2a84a3b416  PCP-to-TP DSpark KV region mapping. Without it a PCP8
#     prefiller feeding a TP8 decoder fails EVERY NIXL transfer with
#     "KV cache sizes must match between P and D when replicated (region 99:
#     local=65536, remote=524288)" - the draft region replicated across PCP8
#     versus sharded across TP8. The decoder silently recomputes prefill and
#     DSpark acceptance collapses from ~84% to ~40%.
#
# 2a84a3b416 also deletes the guard that rejected every connector except a
# plain NixlConnector kv_producer on a direct-KV prefiller, and e7ede2722b
# makes native KV offload correct under direct-KV by storing one shared host
# copy instead of PCP_SIZE identical replicas. Host-tier offload is
# deliberately left off here so that this matrix changes one variable at a
# time relative to the B200 arms already run.
#
# Pinned to 0f349c92c4 = e7ede2722 + one H200 fix ("[DSpark][PCP] Tolerate
# zero-token PCP ranks in context-KV precompute"). On SM90 the FlashMLA
# sparse builder does not pad the PCP shard, so a rank can own zero prompt
# tokens; the drafter's fused RoPE then hit query.numel() / 0 in the
# libtorch_stable launcher and every PCP8 prefiller died with SIGFPE on its
# first request. The env directory keeps its e7ede2722 name.
extends: base-agentx-prefill8-dp8.yaml
runtime:
  # Shared RWX workspace PVC: one `ve` env serves every node and both roles.
  vllm_env: /workspace/vdptest/frankenstein-clean-dspark-pd-e7ede2722
  env:
    EXPECTED_VLLM_COMMIT: 95eb419caf7501fd3c9d05887e897528d2f835d8
vars:
  dspark: &dspark
    method: dspark
    model: RedHatAI/GLM-5.2-speculator.dspark
    revision: cc714308fc4ad68b667a6a71bbf2a344c2ef903b
    num_speculative_tokens: 7
    draft_sample_method: probabilistic
    kv_cache_dtype: fp8
roles:
  prefill:
    env:
      VLLM_USE_PCP_DIRECT_KV: "1"
      VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
      # A worker that dies on a signal otherwise leaves no trace at all.
      PYTHONFAULTHANDLER: "1"
    vllm:
      max_model_len: 142000
      gpu_memory_utilization: 0.94
      max_num_batched_tokens: 16384
      # DSpark's full-attention draft uses FlashInfer, which does not accept
      # the packed verifier-only fp8_ds_mla cache dtype.
      kv_cache_dtype: fp8
      speculative_config: *dspark
      # da30e1b9f5 stops force-disabling prefix caching under direct-KV and
      # admits the copy-on-write path for both the replicated DCP1 and the
      # PCP-spanning DCP=PCP layouts.
      enable_prefix_caching: true
      attention_config:
        sparse_mla_force_mqa: true
      compilation_config:
        cudagraph_mode: PIECEWISE
  decode:
    env:
      PYTHONFAULTHANDLER: "1"
    # 48 vCPU + the 8 vCPU routing-proxy sidecar. The inherited 64 + 8 = 72
    # cannot schedule next to the long-lived devbox/router pods (~60 vCPU
    # requested) on whichever node they share, and nothing here needs it.
    resources: {cpu: 48, memory: 600Gi, gpus: 8, ephemeral_storage: 100Gi}
    vllm:
      max_model_len: 142000
      kv_cache_dtype: fp8
      speculative_config:
        <<: *dspark
        enable_adaptive_verification: false
