# Reference layout ("142k + Baseline" p1w1_d1w1): 1 prefill pod DP8 + EP (DeepEP high-throughput,
# 2048-token chunks) + 1 decode pod DP8 + EP (DeepEP low-latency). 16 GPUs.
# Prefill DP needs the llm-d sidecar to fan out over ports 8000-8007 (routing_proxy + external LB).
extends: base.yaml
release: glm52-p1-dp8ep-d1-dp8ep
roles:
  prefill:
    parallelism: {tp: 1, dp: 8, ep: true}
    routing_proxy: true
    dp_load_balancing: external
    env:
      NVSHMEM_REMOTE_TRANSPORT: ibgda
      NVSHMEM_IB_ENABLE_IBGDA: "true"
      NVSHMEM_HCA_PREFIX: ibp
      NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME: eth0
      NVIDIA_GDRCOPY: enabled
    vllm:
      all2all_backend: deepep_high_throughput
      max_num_batched_tokens: 2048
      gpu_memory_utilization: "0.935"
