# Profiling-only variant: the PCP8+EP prefill role alone (8 GPUs), no router/NIXL, torch profiler on.
# POST /start_profile and /stop_profile on port 8200; traces land on the workspace PVC.
extends: p1-pcp8ep-d1-dp8ep.yaml
release: glm52-prof-p1-pcp8ep
topology: aggregated
routing: {kind: disabled, target_role: prefill}
roles:
  decode: $delete
  prefill:
    routing_proxy: false
    dp_load_balancing: $delete
    kv_transfer_config: $delete
    vllm_raw_args:
      - -cc.cudagraph_mode=NONE
      - --profiler-config.profiler=torch
      - --profiler-config.torch_profiler_dir=/workspace/profiles/prof-p1-pcp8ep
