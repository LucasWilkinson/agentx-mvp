# Shared GLM-5.2 P/D wiring. Deployments own topology and capacity tuning.
# The vLLM build comes from a vllm-envs (`ve`) env on the workspace PVC (VLLM_ENV in .env,
# rendered as --vllm-env); model.image is only the CUDA toolchain image (override: VLLM_IMAGE).
# KV moves via NIXL. CUDA graphs and torch.compile remain enabled unless a
# deployment explicitly changes them.
topology: pd
model:
  id: zai-org/GLM-5.2-FP8
  label: GLM-5.2-FP8
  image: quay.io/rh-ee-lwilkins/vllm-envs-cuda:pr8-cv2
routing: {kind: pd, target_role: decode}
runtime:
  sidecars: []
  # neuralmagic/llm-manifesto scales idle models to zero after 45 min by default; sweeps have idle gaps.
  idle_shutdown: {enabled: false}
  env:
    # Keep Triton's kernel cache off the shared PVC: concurrent pods on different nodes hit
    # NFS "Stale file handle" errors reading it (seen 2026-08-25, p1-tp8ep-d1-tp8ep decode).
    TRITON_CACHE_DIR: /tmp/triton-cache
    # Make the memory profiler reserve room for CUDA graph capture (as in the reference runs); without it
    # the prefill OOMed in sampler graph capture right after the KV cache filled the GPU (2026-08-25).
    VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "1"
vars:
  common_vllm: &common_vllm
    trust_remote_code: true
    kv_cache_dtype: fp8
    moe_backend: deep_gemm
    safetensors_load_strategy: prefetch
    seed: 0
    disable_uvicorn_access_log: true
roles:
  - name: prefill
    # DP8 creates one NIXL/UCX agent per GPU. Keep each agent to one UCX
    # progress thread so concurrent first handshakes do not exhaust Mellanox
    # DevX/UAR resources (observed as ucp_ep_rkey_unpack segfaults at DP8).
    kv_transfer_config: {kv_connector: NixlConnector, kv_role: kv_producer, kv_connector_extra_config: {enforce_handshake_compat: false, num_threads: 1}}
    vllm:
      <<: *common_vllm
  - name: decode
    routing_proxy: true
    dp_load_balancing: external
    kv_transfer_config: {kv_connector: NixlConnector, kv_role: kv_consumer, kv_connector_extra_config: {enforce_handshake_compat: false, num_threads: 1}}
    # DeepEP low-latency needs NVSHMEM (IBGDA over the ibp* HCAs). QP depth = (max_num_batched_tokens + 1) * 2.
    env:
      NVSHMEM_REMOTE_TRANSPORT: ibgda
      NVSHMEM_IB_ENABLE_IBGDA: "true"
      NVSHMEM_HCA_PREFIX: ibp
      NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME: eth0
      NVIDIA_GDRCOPY: enabled
      NVSHMEM_QP_DEPTH: "130"
    vllm:
      <<: *common_vllm
      all2all_backend: deepep_low_latency
