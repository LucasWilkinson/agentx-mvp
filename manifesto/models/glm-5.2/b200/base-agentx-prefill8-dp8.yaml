# Shared B200 AgentX settings for the PCP8/DCP8/EP8 versus TP8/EP8
# prefiller comparison. Concrete specs change only the prefill topology.
extends: base-frankenstein.yaml
roles:
  prefill:
    resources: {cpu: 64, memory: 512Gi, gpus: 8, ephemeral_storage: 1Ti}
    env:
      # AgentX exercises many batch shapes. Keep both comparison arms on the
      # same PyNccl fallback after the symmetric-memory window exhaustion seen
      # during the GB200 PCP sweep.
      VLLM_USE_NCCL_SYMM_MEM: "0"
      VLLM_SERVER_DEV_MODE: "1"
    vllm:
      max_model_len: 142000
      gpu_memory_utilization: 0.90
      max_num_batched_tokens: 16384
      max_num_seqs: 16
      enable_prefix_caching: true
      all2all_backend: deepep_high_throughput
      compilation_config: {cudagraph_mode: NONE}
      kernel_config:
        enable_flashinfer_autotune: false
        linear_backend: deep_gemm
  decode:
    parallelism: {tp: 1, dp: 8, ep: true}
    resources: {cpu: 64, memory: 512Gi, gpus: 8, ephemeral_storage: 1Ti}
    env:
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_SERVER_DEV_MODE: "1"
    vllm:
      max_model_len: 142000
      gpu_memory_utilization: 0.94
      max_num_batched_tokens: 512
      max_num_seqs: 64
      enable_prefix_caching: true
      compilation_config: {cudagraph_mode: NONE}
      kernel_config:
        enable_flashinfer_autotune: false
