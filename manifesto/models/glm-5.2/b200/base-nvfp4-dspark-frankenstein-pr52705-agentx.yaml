# Pinned GLM-5.2 NVFP4/FP8 + DSpark settings for the B200 integration build.
# The DSpark draft is instantiated on both P/D roles so NIXL registers matching
# target and draft KV-cache regions.
extends: ../../glm-5.3/b200/base-nvfp4-frankenstein-pr52705-agentx.yaml
model:
  id: RedHatAI/GLM-5.2-NVFP4-FP8
  label: GLM-5.2-NVFP4-FP8-DSpark
  served_name: glm52-nvfp4-dspark
vars:
  dspark: &dspark
    method: dspark
    model: RedHatAI/GLM-5.2-speculator.dspark
    revision: cc714308fc4ad68b667a6a71bbf2a344c2ef903b
    num_speculative_tokens: 7
    draft_sample_method: probabilistic
    kv_cache_dtype: fp8
roles:
  prefill:
    vllm:
      revision: fe85fc4b3a6c0ded6fbbf259c91d8986ea00d020
      tokenizer_revision: fe85fc4b3a6c0ded6fbbf259c91d8986ea00d020
      kv_cache_dtype: fp8
      # Compressed-tensors NVFP4 does not support the deep_gemm MoE backend.
      # Leave selection to vLLM's NVFP4 backend oracle.
      moe_backend: $delete
      speculative_config: *dspark
  decode:
    vllm:
      revision: fe85fc4b3a6c0ded6fbbf259c91d8986ea00d020
      tokenizer_revision: fe85fc4b3a6c0ded6fbbf259c91d8986ea00d020
      kv_cache_dtype: fp8
      moe_backend: $delete
      speculative_config: *dspark
