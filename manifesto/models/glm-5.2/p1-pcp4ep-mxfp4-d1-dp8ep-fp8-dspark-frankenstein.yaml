# Roberto's Frankenstein PCP4 prefiller adapted to P/D with Red Hat's
# MXFP4-expert/FP8-dense checkpoint and the known FP8 DP8 decoder.
extends: base.yaml
release: glm52-p1-pcp4mxfp4-d1-dp8fp8-dspark-frankenstein
model:
  id: RedHatAI/GLM-5.2-MXFP4xFP8_BLOCK
  label: GLM-5.2-MXFP4xFP8_BLOCK
  served_name: RedHatAI/GLM-5.2-MXFP4xFP8_BLOCK
vars:
  dspark: &dspark
    method: dspark
    model: RedHatAI/GLM-5.2-speculator.dspark
    num_speculative_tokens: 7
    draft_sample_method: probabilistic
    kv_cache_dtype: fp8
roles:
  prefill:
    parallelism: {gpus: 4, tp: 1, pcp: 4, dp: 1, ep: true}
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/frankenstein-prefiller-lucas
      VLLM_USE_PCP_DIRECT_KV: "1"
      # Direct PCP KV has side-stream work that the optional graph-memory
      # estimator cannot capture safely. Normal PIECEWISE capture remains on.
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      NVSHMEM_REMOTE_TRANSPORT: ibgda
      NVSHMEM_IB_ENABLE_IBGDA: "true"
      NVSHMEM_HCA_PREFIX: ibp
      NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME: eth0
      NVIDIA_GDRCOPY: enabled
    vllm:
      # On H200 this selects MARLIN; DeepGEMM MXFP4 requires SM100+.
      moe_backend: auto
      max_model_len: 114688
      gpu_memory_utilization: 0.98
      max_num_batched_tokens: 32768
      max_num_seqs: 256
      all2all_backend: deepep_high_throughput
      speculative_config: *dspark
  decode:
    model: zai-org/GLM-5.2-FP8
    parallelism: {tp: 1, dp: 8, ep: true}
    dp_load_balancing: external
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/frankenstein-prefiller-lucas
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      NVSHMEM_QP_DEPTH: "1026"
    vllm:
      moe_backend: deep_gemm
      all2all_backend: deepep_low_latency
      # DSpark leaves less room for KV than the target-only decoder. Keep the
      # full observed AgentX prompt range (old sweep max: 105,011 tokens).
      max_model_len: 114688
      gpu_memory_utilization: 0.985
      max_num_batched_tokens: 512
      max_num_seqs: 64
      speculative_config: *dspark
