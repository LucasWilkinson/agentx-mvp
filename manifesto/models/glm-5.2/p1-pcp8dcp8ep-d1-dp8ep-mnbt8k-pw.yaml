# p1-pcp8dcp8ep-d1-dp8ep-mnbt8k with PIECEWISE CUDA graphs on the PCP prefill (vllm-project/vllm#53515 persistent
# input buffers + the branch's sparse-MLA piecewise enablement). VLLM_USE_BREAKABLE_CUDAGRAPH=0 opts out of the
# auto-enabled breakable graphs whose segment capture fails under PCP ("capturing stream has unjoined work").
extends: p1-pcp8dcp8ep-d1-dp8ep-mnbt8k.yaml
release: glm52-p1-pcp8dcp8ep-d1-dp8ep-mnbt8k-pw
roles:
  prefill:
    env:
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
    vllm_raw_args:
      - -cc.cudagraph_mode=PIECEWISE
