# 1 prefill pod PCP8 + EP + 1 decode pod TP8 + EP (TEP8). 16 GPUs.
extends: p1-pcp8ep-d1-dp8ep.yaml
release: glm52-p1-pcp8ep-d1-tp8ep
roles:
  decode:
    parallelism: {tp: 8, dp: 1, ep: true}
    dp_load_balancing: internal
    env: {NVSHMEM_QP_DEPTH: "1026"}
    vllm:   # one engine serves all 8 GPUs, so 8x the per-rank decode budget of the DP8 variants
      max_num_batched_tokens: 512
      max_num_seqs: 512
