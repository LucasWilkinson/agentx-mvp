# Replicated-KV PCP8 (DCP1) 8k P/D with offloading on nm/glm-53-blog/prefiller (both roles), which carries the
# NIXL fix for replicated-PCP ranks > 0 inside a MultiConnector (the vllm-main env stalls the prefill engine at
# 0 running / N waiting once NIXL + OffloadingConnector are combined under PCP).
extends: p1-pcp8ep-d1-dp8ep-mnbt8k.yaml
release: glm52-p1-pcp8ep-d1-dp8ep-mnbt8k-glm53
roles:
  prefill:
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/glm53-prefiller
  decode:
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/glm53-prefiller
