# Baseline for the PCP8 x DCP8 probe: same branch env, PCP8 (DCP1), 4k chunks, graphs off.
extends: prof-p1-pcp8ep-glm53.yaml
release: glm52-prof-p1-pcp8ep-glm53-base
roles:
  prefill:
    vllm:
      max_num_batched_tokens: 4096
    vllm_raw_args:
      - -cc.cudagraph_mode=NONE
      - --profiler-config.profiler=torch
      - --profiler-config.torch_profiler_dir=/workspace/profiles/prof-p1-pcp8ep-glm53-base
