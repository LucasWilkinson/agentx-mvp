# PCP8 x DCP8 x TP1 + EP prefill-only on nm/glm-53-blog/prefiller (DCP spanning the PCP group shards the
# KV cache across the 8 ranks instead of replicating it). No NIXL. 4k chunks.
extends: prof-p1-pcp8ep.yaml
release: glm52-prof-p1-pcp8ep-dcp8
roles:
  prefill:
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/glm53-prefiller
      VLLM_PCP_DCP_DEBUG: "0"
    vllm_raw_args:
      - --tensor-parallel-size 1
      - --prefill-context-parallel-size 8
      - --decode-context-parallel-size 8
      - --dcp-comm-backend ag_rs   # FlashMLA sparse only validates ag_rs; the PCP default picks a2a
      - -cc.cudagraph_mode=NONE
      - --profiler-config.profiler=torch
      - --profiler-config.torch_profiler_dir=/workspace/profiles/prof-p1-pcp8ep-dcp8
