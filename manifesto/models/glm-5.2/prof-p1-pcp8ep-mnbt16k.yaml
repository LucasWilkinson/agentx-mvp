# PCP8+EP prefill-only profiling variant with 16k-token chunks (2048 tokens per PCP rank per step).
extends: prof-p1-pcp8ep.yaml
release: glm52-prof-p1-pcp8ep-mnbt16k
roles:
  prefill:
    vllm:
      max_num_batched_tokens: 16384
      # main's PCP profile run sizes activations for the full chunk per rank; drop max_model_len so KV still fits.
      max_model_len: 90112
    vllm_raw_args:
      - --tensor-parallel-size 1
      - --prefill-context-parallel-size 8
      - -cc.cudagraph_mode=NONE
      - --profiler-config.profiler=torch
      - --profiler-config.torch_profiler_dir=/workspace/profiles/prof-p1-pcp8ep-mnbt16k
