# 1 prefill pod PCP8 + EP (TP1 x prefill-context-parallel 8) + 1 decode pod DP8+EP. 16 GPUs.
# manifesto has no PCP notion and rejects tp:1 on an 8-GPU pod, so the role is declared TP8
# (correct pod sizing and --device-ids) and vllm_raw_args re-issue the real parallelism;
# argparse keeps the last occurrence.
extends: base.yaml
release: glm52-p1-pcp8ep-d1-dp8ep
roles:
  prefill:
    parallelism: {tp: 8, dp: 1, ep: true}
    # No KV offloading under PCP: with the MultiConnector(NIXL + OffloadingConnector) the prefill engine hung
    # (0 running / N waiting / KV 80% forever, 2026-08-25). NIXL under PCP is producer-only anyway.
    kv_transfer_config: {kv_connector: NixlConnector, kv_role: kv_producer, kv_connector_extra_config: {enforce_handshake_compat: false}}
    # PCP counts as a DP-like EP layout in vLLM (use_all2all_kernels: ep and (dp>1 or pcp>1)), so DeepEP
    # high-throughput dispatch applies here (it does not for TP8+EP prefill, which is dp=1/pcp=1).
    env:
      NVSHMEM_REMOTE_TRANSPORT: ibgda
      NVSHMEM_IB_ENABLE_IBGDA: "true"
      NVSHMEM_HCA_PREFIX: ibp
      NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME: eth0
      NVIDIA_GDRCOPY: enabled
    vllm:
      all2all_backend: deepep_high_throughput
      # TP1 leaves ~20 GiB per GPU after weights; DeepEP-HT buffers + 8k-token activations overflowed it
      # (flash_mla new_empty failed during warmup, 2026-08-25). Reference DP8 prefill used 2048.
      max_num_batched_tokens: 4096
      # TP1 keeps full attention weights per GPU, so KV headroom is tight; PCP runs without CUDA graphs
      # (see below) so it does not need the capture reserve that base.yaml's 0.90 leaves for TP8 prefill.
      gpu_memory_utilization: "0.92"   # was 0.95; warmup then OOMed once DeepEP-HT + offloading were added
    vllm_raw_args:
      - --tensor-parallel-size 1
      - --prefill-context-parallel-size 8
      # vLLM: "MRV2 sparse MLA PCP does not support CUDA graphs yet" -> graphs off (torch.compile stays on)
      # for this prefill role only. Prefill is compute-bound so this costs little.
      - -cc.cudagraph_mode=NONE
