# PCP8 x DCP8 prefill (see p1-pcp8dcp8ep-d1-dp8ep.yaml) + HiSparse decode (see p1-dp8ep-d1-dp8ep-hisparse.yaml).
extends: p1-pcp8dcp8ep-d1-dp8ep.yaml
release: glm52-p1-pcp8dcp8ep-d1-dp8ep-hisparse
roles:
  decode:
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/glm53-decoder
    resources: {memory: 1200Gi}
    vllm_raw_args:
      - --attention-config.hisparse_config='{"host_pool_gib":100}'
