# Reference layout + DSpark speculative decoding (RedHatAI/GLM-5.2-speculator.dspark, 7 draft tokens,
# adaptive verification) on both roles. Decode max_num_batched_tokens is raised from 64 to 512 because
# each running sequence now needs 1 + 7 verify tokens per step (64 seqs x 8).
extends: p1-dp8ep-d1-dp8ep.yaml
release: glm52-p1-dp8ep-d1-dp8ep-dspark
vars:
  dspark: &dspark
    method: dspark
    model: RedHatAI/GLM-5.2-speculator.dspark
    num_speculative_tokens: 7
    enable_adaptive_verification: true
    # the drafter is a dense Qwen3-style model: it cannot use the target's fp8_ds_mla KV layout
    kv_cache_dtype: fp8
roles:
  prefill:
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/glm53-prefiller   # newer main; vllm-main's DSpark asserts in the profile run
    vllm:
      # the drafter emits 7 query tokens per request into buffers sized at max_num_batched_tokens (2048),
      # so the default max_num_seqs (1024) overflowed them in the profile run: 256 x 7 = 1792 <= 2048
      max_num_seqs: 256
      # no adaptive verification here: MRV2 requires CUDA graphs for it and the offload
      # connector forces cudagraph_mode=NONE on this role (the prefiller never verifies anyway)
      speculative_config:
        method: dspark
        model: RedHatAI/GLM-5.2-speculator.dspark
        num_speculative_tokens: 7
        kv_cache_dtype: fp8
  decode:
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/glm53-prefiller
    vllm:
      speculative_config: *dspark
      max_num_batched_tokens: 512
