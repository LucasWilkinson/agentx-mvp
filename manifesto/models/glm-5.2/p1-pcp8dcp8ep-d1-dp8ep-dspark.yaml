# Current deployment: FP8 PCP8 x TP1 x DCP8 + EP prefill, and FP8 DP8 + EP
# decode with DSpark. The producer transfers target-model KV only; speculative
# draft KV is decoder-local.
extends: base-frankenstein.yaml
release: glm52-p1-pcp8dcp8ep-d1-dp8ep-dspark
roles:
  prefill:
    parallelism: {gpus: 8, tp: 1, pcp: 8, dcp: 8, dp: 1, ep: true}
    # Match the old offloading deployment: publish KV to the decoder through
    # NIXL and retain completed prefixes in a 100 GiB native CPU tier.
    kv_transfer_config:
      kv_connector: MultiConnector
      kv_role: kv_both
      kv_load_failure_policy: fail
      kv_connector_extra_config:
        connectors:
          - kv_connector: NixlConnector
            kv_role: kv_producer
            kv_load_failure_policy: fail
            kv_connector_extra_config:
              enforce_handshake_compat: false
              num_threads: 1
          - kv_connector: OffloadingConnector
            kv_role: kv_both
            kv_connector_extra_config:
              spec_name: TieringOffloadingSpec
              cpu_bytes_to_use: 107374182400
              eviction_policy: lru
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/frankenstein-prefiller-lucas-dcp-offload
      PYTHONPATH: /workspace/vdptest/frankenstein-prefiller-lucas-dcp-offload
      # Direct PCP KV intentionally disables prefix caching/copy-on-write.
      # PCP-spanning DCP supports the gathered path, which is required here.
      VLLM_USE_PCP_DIRECT_KV: "0"
      VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
    vllm:
      # Null omits --max-model-len and uses the checkpoint default.
      max_model_len: null
      all2all_backend: deepep_high_throughput
      dcp_comm_backend: ag_rs
      gpu_memory_utilization: 0.90
      max_num_batched_tokens: 16384
      max_num_seqs: 16
      # DeepEP-HT dispatch/combine cannot be captured. Disable graphs without
      # --enforce-eager so DeepGEMM and the selected attention kernels remain.
      compilation_config: {cudagraph_mode: NONE}
      # Prefill never executes sparse decode; autotuning it at the full 32k
      # scheduler shape otherwise allocates an unnecessary 8 GiB temporary.
      kernel_config:
        enable_flashinfer_autotune: false
        linear_backend: deep_gemm
  decode:
    parallelism: {tp: 1, dp: 8, ep: true}
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/frankenstein-prefiller-lucas-dcp-offload
      PYTHONPATH: /workspace/vdptest/frankenstein-prefiller-lucas-dcp-offload
      # Avoid a duplicate graph capture that trips PyTorch's pinned-host
      # allocator; 0.94 without estimation matches ~0.985 with its 4.45 GiB reserve.
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    vllm:
      max_model_len: 114688
      gpu_memory_utilization: 0.94
      max_num_batched_tokens: 512
      max_num_seqs: 64
