# Current deployment: FP8 PCP8 x TP1 x DCP8 + EP prefill, and FP8 DP8 + EP
# decode with DSpark. The producer also instantiates the draft KV cache so its
# NIXL region set exactly matches the consumer's during direct transfer.
extends: base-frankenstein.yaml
release: glm52-p1-pcp8dcp8ep-d1-dp8ep-dspark
roles:
  prefill:
    parallelism: {gpus: 8, tp: 1, pcp: 8, dcp: 8, dp: 1, ep: true}
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/frankenstein-prefiller-lucas-dcp
      PYTHONPATH: /workspace/vdptest/frankenstein-prefiller-lucas-dcp
      VLLM_USE_PCP_DIRECT_KV: "1"
      VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
      # Use the non-torch.compile capture path. Operations decorated with
      # eager_break_during_capture execute between breakable graph segments.
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      # Let ElasticBuffer overlap with compute instead of imposing its
      # non-overlap 64-SM floor; DCP collectives need room to make progress.
      VLLM_DEEPEP_V2_PREFER_OVERLAP: "1"
    vllm:
      # Null omits --max-model-len and uses the checkpoint default.
      max_model_len: null
      # DeepEP HT is not CUDA-graph compatible. DeepEP v2 uses its
      # cudagraph-safe ElasticBuffer path while retaining FP8 dispatch.
      all2all_backend: deepep_v2
      dcp_comm_backend: ag_rs
      # DSpark's producer-side draft cache is required for NIXL region
      # compatibility. DCP8 needs 9.58 GiB for the checkpoint's 1,048,576-token
      # default context; DeepEP v2 leaves 7.83 GiB at 0.935, so reserve 0.95.
      gpu_memory_utilization: 0.95
      max_num_batched_tokens: 16384
      max_num_seqs: 16
      # Breakable graph replay currently strands the PCP/DCP collective before
      # the first DeepEP dispatch. Keep torch eager execution without setting
      # --enforce-eager so DeepGEMM and the selected attention kernels remain.
      compilation_config: {cudagraph_mode: NONE}
      speculative_config:
        method: dspark
        model: RedHatAI/GLM-5.2-speculator.dspark
        num_speculative_tokens: 7
        draft_sample_method: probabilistic
        kv_cache_dtype: fp8
      # Prefill never executes sparse decode; autotuning it at the full 32k
      # scheduler shape otherwise allocates an unnecessary 8 GiB temporary.
      kernel_config:
        enable_flashinfer_autotune: false
        linear_backend: deep_gemm
  decode:
    parallelism: {tp: 1, dp: 8, ep: true}
    env:
      MANIFESTO_VLLM_ENV: /workspace/vdptest/frankenstein-prefiller-lucas-dcp
      PYTHONPATH: /workspace/vdptest/frankenstein-prefiller-lucas-dcp
      # Avoid a duplicate graph capture that trips PyTorch's pinned-host
      # allocator; 0.94 without estimation matches ~0.985 with its 4.45 GiB reserve.
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    vllm:
      max_model_len: 114688
      gpu_memory_utilization: 0.94
      max_num_batched_tokens: 512
      max_num_seqs: 64
