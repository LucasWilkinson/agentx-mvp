# PCP8 x DCP8 prefill-only probe with 64k chunks (8192 tokens per PCP rank per step).
extends: bench-p1-pcp8ep-dcp8.yaml
release: glm52-bench-p1-pcp8ep-dcp8-mnbt64k
roles:
  prefill:
    env:
      # bound the fused-MoE workspace (sized by the global chunk; each EP rank can receive tokens from all ranks)
      VLLM_FUSED_MOE_CHUNK_SIZE: "8192"
    vllm:
      max_num_batched_tokens: 65536
