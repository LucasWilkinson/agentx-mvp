          - --collector.cpu
          - --path.sysfs=/host/sys
          - --path.procfs=/host/proc
          ports:
          - containerPort: 9100
            name: node-metrics
            protocol: TCP
          volumeMounts:
          - name: sys
            mountPath: /host/sys
            readOnly: true
          - name: proc
            mountPath: /host/proc
            readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: llm-d-dev-claim
