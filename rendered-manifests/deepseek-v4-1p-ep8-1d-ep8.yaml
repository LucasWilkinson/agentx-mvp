apiVersion: v1
kind: ConfigMap
metadata:
  name: tms-wide-ep-1p-ep8-1d-ep8-epp-config
  labels:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/instance: tms-wide-ep-1p-ep8-1d-ep8
    llm-d.ai/owner: tms
    app.kubernetes.io/component: routing
data:
  plugins.yaml: |
    apiVersion: inference.networking.x-k8s.io/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: prefill-filter
    - type: decode-filter
    - type: prefix-cache-scorer
    - type: active-request-scorer
    - type: queue-scorer
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciders:
          prefill: always-disagg-pd-decider
    - type: weighted-random-picker
      name: prefill-picker
      parameters:
        threshold: 0.1
        hashBlockSize: 5
    - type: weighted-random-picker
      name: decode-picker
      parameters:
        threshold: 0.1
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefix-cache-scorer
        weight: 3
      - pluginRef: active-request-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: prefill-picker
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
        weight: 2
      - pluginRef: decode-picker
