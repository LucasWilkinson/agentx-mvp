apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-orchestrator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["leaderworkerset.x-k8s.io"]
    resources: ["leaderworkersets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["destinationrules"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues", "workloads"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmark-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: benchmark-orchestrator
subjects:
  - kind: ServiceAccount
    name: benchmark-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-orchestrator
  labels:
    app: benchmark-orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: benchmark-orchestrator
  template:
    metadata:
      labels:
        app: benchmark-orchestrator
    spec:
      serviceAccountName: benchmark-orchestrator
      restartPolicy: Always
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: orchestrator
          image: quay.io/tms/benchmark-orchestrator:amd64
          imagePullPolicy: Always
          command: ["sleep", "infinity"]
          workingDir: /workspace
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 10Gi
          volumeMounts:
            - name: orchestrator-spec
              mountPath: /workspace/benchmark-sweep.env
              subPath: benchmark-sweep.env
      volumes:
        - name: orchestrator-spec
          configMap:
            name: benchmark-orchestrator-spec
