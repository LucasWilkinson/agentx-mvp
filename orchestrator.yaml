apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-orchestrator
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmark-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: benchmark-orchestrator
subjects:
  - kind: ServiceAccount
    name: benchmark-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-orchestrator
  labels:
    app: benchmark-orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: benchmark-orchestrator
  template:
    metadata:
      labels:
        app: benchmark-orchestrator
    spec:
      serviceAccountName: benchmark-orchestrator
      restartPolicy: Always
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: orchestrator
          image: quay.io/tms/benchmark-orchestrator:amd64
          imagePullPolicy: Always
          command: ["sleep", "infinity"]
          workingDir: /workspace
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 10Gi
