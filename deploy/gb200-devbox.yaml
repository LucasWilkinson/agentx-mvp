apiVersion: v1
kind: Pod
metadata:
  name: lwilkinson-vllm-devbox
  namespace: vllm
  labels:
    app.kubernetes.io/name: lwilkinson-vllm-devbox
    app.kubernetes.io/component: development
spec:
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-GB200
  containers:
    - name: devbox
      image: nvcr.io/nvidia/pytorch:25.08-py3
      imagePullPolicy: IfNotPresent
      command: [bash, -lc, "sleep infinity"]
      env:
        - {name: HOME, value: /mnt/lustre/lwilkinson}
        - {name: VE_CACHE_DIR, value: /mnt/lustre/lwilkinson/.cache/vllm-envs}
        - {name: VE_ENVS_ROOT, value: /mnt/lustre/lwilkinson/vdptest}
        - {name: UV_TOOL_DIR, value: /mnt/lustre/lwilkinson/.local/uv-tools}
        - {name: UV_TOOL_BIN_DIR, value: /mnt/lustre/lwilkinson/.local/bin}
        - {name: TORCH_CUDA_ARCH_LIST, value: "10.0+PTX"}
        - {name: MAX_JOBS, value: "32"}
        - {name: NVCC_THREADS, value: "2"}
        - name: PATH
          value: /mnt/lustre/lwilkinson/.local/bin:/usr/local/cuda/bin:/usr/local/bin:/usr/bin:/bin
      resources:
        requests: {cpu: "16", memory: 64Gi, ephemeral-storage: 32Gi}
        limits: {memory: 128Gi, ephemeral-storage: 128Gi}
      volumeMounts:
        - {name: workspace, mountPath: /mnt/lustre}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: lustre-pvc-vllm
    - name: dshm
      emptyDir: {medium: Memory, sizeLimit: 16Gi}
