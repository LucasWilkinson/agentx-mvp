# Copy this file into an environment overlay and replace the API server CIDR,
# VDP namespace, DNS selectors, target endpoint, and monitoring destinations.
# It is intentionally not applied by `just agentx-service-deploy`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentx-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentx-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vllm-development-platform
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - ipBlock: {cidr: 192.0.2.1/32} # REPLACE: Kubernetes API
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector: {} # REPLACE with DNS/target/monitoring selectors
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 9400}
